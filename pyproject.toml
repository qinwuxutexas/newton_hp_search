[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "newton-hpo"
version = "0.1.0"
description = "Damped Gauss-Newton hyperparameter search for XGBoost, with grid/random/TPE baselines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "optuna",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
newton-hpo-smoke = "newton_hpo.cli:smoke"
newton-hpo-run = "newton_hpo.cli:run_single"
newton-hpo-benchmark = "newton_hpo.cli:run_benchmark"

[tool.setuptools.packages.find]
where = ["src"]
